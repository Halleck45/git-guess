name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]  # semver only: the moving v1 tag of the action must not release

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        # trusted publishing (OIDC): this workflow is declared as a trusted
        # publisher of the git-guess package on npmjs.com, no token needed.
        # Provenance is attached automatically. Requires npm >= 11.5.1.
        # Does not fail the release while the trusted publisher is not set up yet.
        continue-on-error: true
        working-directory: npm
        run: |
          npm install -g npm@latest
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish --access public
